name: Lantern CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci
      - run: npm run typecheck
  tests:
    name: PostgreSQL HTTP and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated_ci
          POSTGRES_DB: lantern_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:isolated_ci@127.0.0.1:5432/lantern_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node tools/release/stamp.mjs
        env:
          RELEASE_SHA: ${{ github.sha }}
      - run: docker build -t lantern-ci .
  stage:
    name: stage delivery and smoke
    needs: [typecheck, tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stage
    concurrency:
      group: lantern-stage
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.sha }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      RELEASE_TARGET: stage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - name: Enforce exact revision and successful checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import { stageGate } from './tools/release/gates.mjs';
          import { execFileSync } from 'node:child_process';
          stageGate({event:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,sha:process.env.RELEASE_SHA,checkedSha:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),checks:Object.values(JSON.parse(process.env.CHECK_RESULTS)).map(x=>x.result)});
          JS
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install --global @railway/cli@5.68.0
      - run: node tools/release/stamp.mjs
      - name: Upload the checked source revision
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: node tools/release/deploy.mjs
      - name: Exact-revision readiness and stage E2E
        env:
          QA_MEMBER_A_SESSION: ${{ secrets.QA_MEMBER_A_SESSION }}
          QA_MEMBER_B_SESSION: ${{ secrets.QA_MEMBER_B_SESSION }}
        run: node tools/release/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: stage-evidence-${{ github.sha }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
