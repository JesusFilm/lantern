name: Deploy production
on:
  workflow_run:
    workflows: [Lantern CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA with successful staging delivery
        required: true
permissions:
  contents: read
  actions: read
env:
  RELEASE_MODE: ${{ github.event_name == 'workflow_run' && 'automatic' || 'manual' }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
  STAGE_RUN_ID: ${{ github.event.workflow_run.id }}
  STAGE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
  GH_TOKEN: ${{ github.token }}
jobs:
  admission:
    # This job has no production environment or production secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       vars.AUTO_PRODUCTION_ENABLED == 'true' &&
       vars.STAGE_ACCEPTANCE_ENABLED == 'true' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.path == '.github/workflows/ci.yml' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: '26.13.0' }
      - name: Admit only verified main release evidence
        run: node tools/release/verify-promotion.mjs --admission
  promote:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: lantern-production
      cancel-in-progress: false
    env:
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      STAGE_APP_ORIGIN: ${{ vars.STAGE_APP_ORIGIN }}
      RELEASE_TARGET: production
    steps:
      # Gate implementation comes from protected main, not arbitrary dispatch input.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with: { node-version: '26.13.0', cache: npm }
      - run: npm ci
      - name: Verify release evidence and automatic freshness under the production lock
        run: node tools/release/verify-promotion.mjs
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: candidate
      - name: Verify candidate checkout
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - run: npm ci
        working-directory: candidate
      - run: npx playwright install --with-deps chromium
      - run: npm install --global @railway/cli@5.70.0
      - run: npm run build
        working-directory: candidate
      - run: node ../tools/release/stamp.mjs
        working-directory: candidate
      - name: Check hosted configuration using protected main
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          LANTERN_DB_RUNTIME_ROLE: ${{ vars.LANTERN_DB_RUNTIME_ROLE }}
        run: node tools/release/configuration.mjs
      - name: Recheck automatic release immediately before migrations
        if: env.RELEASE_MODE == 'automatic'
        run: node tools/release/verify-promotion.mjs --freshness
      - name: Apply exact-revision schema migrations
        working-directory: candidate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_CA: ${{ secrets.MIGRATION_DATABASE_CA }}
          LANTERN_DB_EXPECTED_ENDPOINT: ${{ vars.LANTERN_DB_EXPECTED_ENDPOINT }}
          LANTERN_DB_NAME: ${{ vars.LANTERN_DB_NAME }}
          LANTERN_DB_SCHEMA: lantern
          LANTERN_DB_RUNTIME_ROLE: ${{ vars.LANTERN_DB_RUNTIME_ROLE }}
          LANTERN_DB_MIGRATION_ROLE: ${{ vars.LANTERN_DB_MIGRATION_ROLE }}
          LANTERN_DB_ADMIN_ROLE: ${{ vars.LANTERN_DB_ADMIN_ROLE }}
        run: node ../tools/release/migrate.mjs
      - name: Promote exact candidate
        working-directory: candidate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT }}
          LANTERN_DB_RUNTIME_ROLE: ${{ vars.LANTERN_DB_RUNTIME_ROLE }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: node ../tools/release/deploy.mjs
      - run: node ../tools/release/smoke.mjs
        working-directory: candidate
        env:
          RELEASE_SMOKE_MODE: readiness
      - name: Record production release
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const evidence=JSON.parse(readFileSync('candidate/release-evidence.json'));
          writeFileSync('production-evidence.json',JSON.stringify({...evidence,stageRunId:process.env.STAGE_RUN_ID,stageRunAttempt:process.env.STAGE_RUN_ATTEMPT || undefined,releaseMode:process.env.RELEASE_MODE,operator:process.env.GITHUB_ACTOR},null,2));
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: production-evidence-${{ env.RELEASE_SHA }}
          path: production-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
