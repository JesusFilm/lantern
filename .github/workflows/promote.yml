name: Deploy production
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA with successful staging delivery
        required: true
permissions:
  contents: read
  actions: read
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: lantern-production
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      RELEASE_TARGET: production
    steps:
      # Gate implementation comes from protected main, not arbitrary dispatch input.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '24.21.0', cache: npm }
      - run: npm ci
      - name: Verify main revision and successful staging delivery
        run: node tools/release/verify-promotion.mjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: candidate
      - name: Verify candidate checkout
        working-directory: candidate
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - run: npm ci
        working-directory: candidate
      - run: npx playwright install --with-deps chromium
      - run: npm install --global @railway/cli@5.70.0
      - run: npm run build
        working-directory: candidate
      - run: node ../tools/release/stamp.mjs
        working-directory: candidate
      - name: Check hosted configuration using protected main
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          LANTERN_DB_RUNTIME_ROLE: ${{ vars.LANTERN_DB_RUNTIME_ROLE }}
        run: node tools/release/configuration.mjs
      - name: Apply exact-revision schema migrations
        working-directory: candidate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_CA: ${{ secrets.MIGRATION_DATABASE_CA }}
          LANTERN_DB_EXPECTED_ENDPOINT: ${{ vars.LANTERN_DB_EXPECTED_ENDPOINT }}
          LANTERN_DB_NAME: ${{ vars.LANTERN_DB_NAME }}
          LANTERN_DB_SCHEMA: lantern
          LANTERN_DB_RUNTIME_ROLE: ${{ vars.LANTERN_DB_RUNTIME_ROLE }}
          LANTERN_DB_MIGRATION_ROLE: ${{ vars.LANTERN_DB_MIGRATION_ROLE }}
          LANTERN_DB_ADMIN_ROLE: ${{ vars.LANTERN_DB_ADMIN_ROLE }}
        run: node ../tools/release/migrate.mjs
      - name: Promote exact candidate
        working-directory: candidate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT: ${{ vars.RAILWAY_PROJECT }}
          LANTERN_DB_RUNTIME_ROLE: ${{ vars.LANTERN_DB_RUNTIME_ROLE }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: node ../tools/release/deploy.mjs
      - run: node ../tools/release/smoke.mjs
        working-directory: candidate
        env:
          RELEASE_SMOKE_MODE: readiness
          EXPECTED_SCHEMA_VERSION: '5'
      - name: Record production release
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const evidence=JSON.parse(readFileSync('candidate/release-evidence.json'));
          writeFileSync('production-evidence.json',JSON.stringify({...evidence,stageRunId:process.env.STAGE_RUN_ID,operator:process.env.GITHUB_ACTOR},null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: production-evidence-${{ inputs.sha }}
          path: production-evidence.json
          if-no-files-found: error
          retention-days: 90
