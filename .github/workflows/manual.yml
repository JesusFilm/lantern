name: QA manual release
# Publishes each new manual edition as a GitHub release, so QA can always open
# https://github.com/JesusFilm/lantern/releases/latest/download/lantern-manual.pdf
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MANUAL_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Fetch main for manual edition comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with: { node-version: '26.13.0', cache: npm }
      - run: npm ci
      - run: npm run manual:check
      - name: Publish the edition once
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/manual/release.sh --publish
