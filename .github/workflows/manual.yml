name: QA manual release
# Publishes each new manual edition as a GitHub release, so QA can always open
# https://github.com/JesusFilm/lantern/releases/latest/download/lantern-manual.pdf
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MANUAL_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Fetch main for manual edition comparison
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with: { node-version: '26.13.0', cache: npm }
      - run: npm ci
      - run: npm run manual:check
      - name: Publish the edition once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse refs/remotes/origin/main)" ]; then
            echo "The manual release is no longer current main; refusing to publish a stale latest release." >&2
            exit 1
          fi
          edition=$(node -p "require('./docs/manual/manifest.json').edition")
          date=$(node -p "require('./docs/manual/manifest.json').editionDate")
          tag="manual-$edition"
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = "true" ]; then
              # gh create uploads through a draft. A failed upload/publish can
              # leave that draft behind; resume it instead of reporting success.
              gh release upload "$tag" docs/manual/lantern-manual.pdf --clobber
              gh release edit "$tag" --draft=false --latest
            else
              # Do not let a later unrelated push hide an earlier invalid
              # edition reuse. Compare with the immutable published tag.
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
              git show "$tag:docs/manual/manifest.json" | node -e '
                const fs = require("node:fs");
                const published = JSON.parse(fs.readFileSync(0, "utf8"));
                const current = require("./docs/manual/manifest.json");
                if (published.edition !== current.edition || typeof published.deck !== "string" || published.deck !== current.deck) {
                  console.error("The published manual edition has different content; generate a new edition.");
                  process.exit(1);
                }
              '
              echo "$tag is already published."
            fi
            exit 0
          fi
          printf 'Lantern QA manual, edition %s (%s), generated from %s.\n\nOpen lantern-manual.pdf below. Screenshots use synthetic data.\n' "$edition" "$date" "$GITHUB_SHA" > notes.md
          gh release create "$tag" docs/manual/lantern-manual.pdf --target "$GITHUB_SHA" --title "QA manual, edition $edition" --notes-file notes.md --latest

